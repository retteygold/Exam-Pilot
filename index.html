  <title>Exam Pilot v2.1 - Navigate Your Way to Top Grades</title>
  <script>
    // Nuclear cache clear - runs before anything else
    (function() {
      console.log('[CACHE] Starting nuclear cache clear...')
      
      // Unregister all service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            console.log('[CACHE] Unregistering SW:', reg.scope)
            reg.unregister()
          })
        })
      }
      
      // Clear all caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            console.log('[CACHE] Deleting cache:', name)
            caches.delete(name)
          })
        })
      }
      
      // Clear localStorage and sessionStorage
      try {
        localStorage.clear()
        sessionStorage.clear()
        console.log('[CACHE] Storage cleared')
      } catch(e) {}
      
      console.log('[CACHE] Nuclear clear complete')
    })()
  </script>
